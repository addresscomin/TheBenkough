<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070912" />
  <title>THE BENKOUGH</title>
  <style>
    :root {
      color-scheme: dark;
      background: #070912;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(24, 29, 55, .42) 0%, transparent 58%),
        linear-gradient(145deg, #070912 0%, #0a0d19 52%, #080b13 100%);
    }

    /* Background layer only — content layers will be added separately. */
    .ambient-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.012), transparent 34%, rgba(255,255,255,.008));
    }

    .glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(76vw, 760px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(clamp(65px, 11vw, 145px));
      opacity: .56;
      transform: translate(-50%, -50%);
      will-change: transform;
      mix-blend-mode: screen;
    }

    .glow-a {
      background: radial-gradient(circle,
        rgba(104, 83, 255, .62) 0%,
        rgba(70, 111, 255, .34) 34%,
        rgba(70, 111, 255, 0) 70%);
      animation: drift-a 15s ease-in-out infinite alternate;
    }

    .glow-b {
      width: min(68vw, 680px);
      opacity: .48;
      background: radial-gradient(circle,
        rgba(34, 210, 190, .46) 0%,
        rgba(41, 137, 205, .28) 38%,
        rgba(41, 137, 205, 0) 72%);
      animation: drift-b 18s ease-in-out infinite alternate;
    }

    .soft-glass-haze {
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg,
        rgba(255,255,255,.018),
        transparent 38%,
        rgba(255,255,255,.012));
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }

    @keyframes drift-a {
      0%   { transform: translate(-53%, -58%) scale(.92); }
      50%  { transform: translate(-47%, -42%) scale(1.08); }
      100% { transform: translate(-53%, -55%) scale(.98); }
    }

    @keyframes drift-b {
      0%   { transform: translate(-45%, -40%) scale(1.06); }
      50%  { transform: translate(-54%, -59%) scale(.94); }
      100% { transform: translate(-46%, -43%) scale(1.04); }
    }

    @media (max-width: 640px) {
      .glow { width: 112vw; filter: blur(76px); opacity: .52; }
      .glow-b { width: 100vw; opacity: .44; }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; }
    }
  </style>
</head>
<body>
  <div class="ambient-layer" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="soft-glass-haze"></div>
  </div>
</body>
</html>
