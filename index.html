<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070910" />
  <title>THE BENKOUGH</title>
  <style>
    :root { color-scheme: dark; background: #070910; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      background:
        linear-gradient(180deg, #080b14 0%, #090d18 48%, #070a12 100%);
    }

    /* Layer 01: full-width animated atmospheric colour / smoke. */
    .ambient-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(180deg,
          rgba(85, 77, 160, .035) 0%,
          transparent 28%,
          rgba(30, 125, 135, .035) 68%,
          transparent 100%);
    }

    .smoke {
      position: absolute;
      left: -30%;
      width: 160%;
      height: 62vh;
      min-height: 340px;
      opacity: .68;
      filter: blur(58px);
      will-change: transform, opacity;
      transform: translate3d(0,0,0);
      background-repeat: no-repeat;
      mix-blend-mode: screen;
    }

    /* Broad, irregular wisps stretch across the whole screen — no centre orb. */
    .smoke-top {
      top: -28vh;
      background-image:
        radial-gradient(ellipse 44% 28% at 18% 72%, rgba(93, 83, 220, .52) 0%, transparent 76%),
        radial-gradient(ellipse 38% 24% at 52% 56%, rgba(44, 126, 190, .42) 0%, transparent 78%),
        radial-gradient(ellipse 42% 30% at 84% 72%, rgba(31, 190, 170, .30) 0%, transparent 76%),
        radial-gradient(ellipse 65% 22% at 48% 88%, rgba(102, 83, 190, .22) 0%, transparent 80%);
      animation: smoke-rise 19s ease-in-out infinite alternate;
    }

    .smoke-middle {
      top: 18vh;
      height: 68vh;
      opacity: .40;
      filter: blur(72px);
      background-image:
        radial-gradient(ellipse 48% 22% at 12% 42%, rgba(43, 151, 181, .34) 0%, transparent 78%),
        radial-gradient(ellipse 52% 24% at 48% 62%, rgba(105, 79, 205, .34) 0%, transparent 80%),
        radial-gradient(ellipse 44% 26% at 88% 40%, rgba(38, 177, 158, .28) 0%, transparent 78%);
      animation: smoke-flow 23s ease-in-out infinite alternate;
    }

    .smoke-bottom {
      bottom: -34vh;
      height: 66vh;
      opacity: .58;
      background-image:
        radial-gradient(ellipse 48% 28% at 14% 28%, rgba(32, 159, 158, .36) 0%, transparent 78%),
        radial-gradient(ellipse 42% 24% at 54% 18%, rgba(82, 86, 211, .42) 0%, transparent 80%),
        radial-gradient(ellipse 46% 30% at 88% 34%, rgba(38, 127, 183, .32) 0%, transparent 78%),
        radial-gradient(ellipse 70% 20% at 50% 8%, rgba(93, 76, 175, .20) 0%, transparent 82%);
      animation: smoke-fall 21s ease-in-out infinite alternate;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.018), transparent 24%, transparent 76%, rgba(255,255,255,.012));
    }

    @keyframes smoke-rise {
      0%   { transform: translate3d(-2%, 5vh, 0) scale(1.02, 1); }
      50%  { transform: translate3d(2%, -5vh, 0) scale(1.08, 1.12); }
      100% { transform: translate3d(-1%, -12vh, 0) scale(1.04, 1.06); }
    }
    @keyframes smoke-flow {
      0%   { transform: translate3d(3%, 7vh, 0) scale(1.04, .96); }
      50%  { transform: translate3d(-3%, -4vh, 0) scale(1.1, 1.08); }
      100% { transform: translate3d(2%, 5vh, 0) scale(1.02, 1); }
    }
    @keyframes smoke-fall {
      0%   { transform: translate3d(2%, -8vh, 0) scale(1.02, 1.04); }
      50%  { transform: translate3d(-2%, 2vh, 0) scale(1.1, .96); }
      100% { transform: translate3d(1%, -3vh, 0) scale(1.04, 1.08); }
    }

    @media (max-width: 640px) {
      .smoke { left: -55%; width: 210%; filter: blur(48px); }
      .smoke-middle { filter: blur(58px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .smoke { animation: none; }
    }
  </style>
</head>
<body>
  <div class="ambient-layer" aria-hidden="true">
    <div class="smoke smoke-top"></div>
    <div class="smoke smoke-middle"></div>
    <div class="smoke smoke-bottom"></div>
    <div class="atmosphere"></div>
  </div>
</body>
</html>
